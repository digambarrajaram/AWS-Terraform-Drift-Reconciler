name: "Process Drift PR Decision"
run-name: "Drift PR Decision — ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.action_type || (github.event.pull_request.merged == true && 'ACCEPTED' || 'REJECTED') }}"

on:
  pull_request:
    types: [closed]
    branches:
      - main

  workflow_dispatch:
    inputs:
      action_type:
        description: 'Manual override'
        required: true
        type: choice
        options:
          - 'Accept (Align State)'
          - 'Reject (Revert Code)'
      scope:
        description: 'Target scope slug — must match an active environment in the Supabase environments table'
        required: true
        type: string

permissions:
  id-token: write
  contents: write
  pull-requests: write

env:
  TF_VERSION: "1.9.8"
  PAGERDUTY_ROUTING_KEY: ${{ secrets.PAGERDUTY_ROUTING_KEY }}
  SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
  SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
  SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}

jobs:
  # ------------------------------------------------------------------
  # Resolve which scope (account + region) this PR or manual run targets
  # by inspecting the PR branch name / title or the workflow_dispatch
  # input.  Outputs the matching GitHub Environment, secret/variable
  # names, and terraform working directory for downstream steps.
  # ------------------------------------------------------------------
  resolve-scope:
    if: |
      (github.event_name == 'pull_request' && contains(github.event.pull_request.title, 'Drift fix')) ||
      github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    outputs:
      scope:           ${{ steps.scope.outputs.scope }}
      gh_environment:  ${{ steps.scope.outputs.gh_environment }}
      aws_region_var:  ${{ steps.scope.outputs.aws_region_var }}
      role_arn:        ${{ steps.scope.outputs.role_arn }}
      tf_working_dir:  ${{ steps.scope.outputs.tf_working_dir }}
    steps:
      - name: Resolve scope from PR metadata or manual input
        id: scope
        run: |
          SCOPE="${{ github.event.inputs.scope }}"

          if [ -z "$SCOPE" ]; then
            BRANCH="${{ github.event.pull_request.head.ref }}"
            SCOPE=$(echo "$BRANCH" | sed -n 's|.*drift-fix/\([^/]*\)/.*|\1|p')
            if [ -z "$SCOPE" ]; then
              TITLE="${{ github.event.pull_request.title }}"
              # NOTE: assumes slugs are prefixed "scope-" — update if/when the
              # scope→environment terminology migration changes naming convention.
              SCOPE=$(echo "$TITLE" | sed -n 's/.*\[\(scope-[a-z0-9][a-z0-9-]*\)\].*/\1/p')
            fi
          fi

          if [ -z "$SCOPE" ]; then
            echo "::error::Could not resolve scope from branch, title, or manual input"
            exit 1
          fi

          ENV_RESP=$(curl -sS -w "\n%{http_code}" \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
            "${SUPABASE_URL}/rest/v1/environments?select=region,tf_directory_path,apply_environment_name,aws_role_arn&slug=eq.${SCOPE}&is_active=eq.true")

          HTTP_CODE=$(echo "$ENV_RESP" | tail -1)
          ENV_JSON=$(echo "$ENV_RESP" | sed '$d')

          if [ "$HTTP_CODE" != "200" ]; then
            echo "::error::Supabase API returned HTTP $HTTP_CODE for scope=${SCOPE}"
            exit 1
          fi
          if [ -z "$ENV_JSON" ] || [ "$ENV_JSON" = "[]" ]; then
            echo "::error::No active environment found for scope=${SCOPE} in Supabase environments table"
            exit 1
          fi

          REGION=$(echo "$ENV_JSON" | jq -r '.[0].region')
          TF_DIR=$(echo "$ENV_JSON" | jq -r '.[0].tf_directory_path')
          GH_ENV=$(echo "$ENV_JSON" | jq -r '.[0].apply_environment_name')
          ROLE_ARN=$(echo "$ENV_JSON" | jq -r '.[0].aws_role_arn')

          for pair in "region:$REGION" "tf_directory_path:$TF_DIR" "apply_environment_name:$GH_ENV" "aws_role_arn:$ROLE_ARN"; do
            key="${pair%%:*}"; val="${pair#*:}"
            if [ -z "$val" ] || [ "$val" = "null" ]; then
              echo "::error::$key is empty for scope=${SCOPE} in Supabase"
              exit 1
            fi
          done

          echo "scope=$SCOPE"                 >> "$GITHUB_OUTPUT"
          echo "gh_environment=$GH_ENV"       >> "$GITHUB_OUTPUT"
          echo "aws_region_var=$REGION"       >> "$GITHUB_OUTPUT"
          echo "role_arn=$ROLE_ARN"           >> "$GITHUB_OUTPUT"
          echo "tf_working_dir=$TF_DIR"       >> "$GITHUB_OUTPUT"
          echo "🔍 Resolved scope=$SCOPE  env=$GH_ENV  role_arn=$ROLE_ARN  dir=$TF_DIR"

  # ------------------------------------------------------------------
  # Apply or revert the drift fix in the resolved scope.
  # ------------------------------------------------------------------
  reconcile-infra:
    needs: [resolve-scope]
    if: |
      (github.event_name == 'pull_request' && contains(github.event.pull_request.title, 'Drift fix')) ||
      github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment: ${{ needs.resolve-scope.outputs.gh_environment }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          # Always check out the base branch (main), never the merge ref.
          # On ACCEPT the drift-fix is already merged into main, so this
          # gives the accepted state.  On REJECT main was never touched,
          # so this gives the pre-drift state to revert to.  Same ref,
          # correct result either way — no dependency on the ephemeral
          # refs/pull/<PR>/merge that can be stale or gone post-close.
          ref: ${{ github.event.pull_request.base.ref }}

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ needs.resolve-scope.outputs.role_arn }}
          aws-region: ${{ needs.resolve-scope.outputs.aws_region_var }}
          audience: sts.amazonaws.com

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform Init
        working-directory: ${{ needs.resolve-scope.outputs.tf_working_dir }}
        run: terraform init

      # =================================================================
      # SCENARIO A: ACCEPTED (Merged) → Code already matches live state
      # =================================================================
      - name: "[ACCEPT] Apply Drift Fix"
        if: |
          (github.event_name == 'pull_request' && github.event.pull_request.merged == true) ||
          (github.event_name == 'workflow_dispatch' && github.event.inputs.action_type == 'Accept (Align State)')
        working-directory: ${{ needs.resolve-scope.outputs.tf_working_dir }}
        run: |
          echo "✅ ACCEPTED: Applying approved drift fix to ${{ needs.resolve-scope.outputs.scope }}..."
          terraform plan -out=tfplan -input=false
          terraform show -json tfplan > tfplan.json

      - name: "[ACCEPT] Pre-apply drift gate"
        id: drift_gate
        if: |
          (github.event_name == 'pull_request' && github.event.pull_request.merged == true) ||
          (github.event_name == 'workflow_dispatch' && github.event.inputs.action_type == 'Accept (Align State)')
        run: |
          MODE="${{ vars.DRIFT_GATE_MODE }}"
          ARGS="${{ needs.resolve-scope.outputs.scope }}"
          if [ "$MODE" = "block" ]; then
            ARGS="$ARGS --block"
          fi
          python ${{ github.workspace }}/drift_reconciler/pre_apply_check.py $ARGS

      - name: "[ACCEPT] Drift gate recovery — revert merge"
        if: |
          steps.drift_gate.outcome == 'failure' &&
          github.event_name == 'pull_request' &&
          github.event.pull_request.merged == true
        run: |
          echo "❌ Pre-apply drift gate blocked — unresolved drift exists. Reverting merge."
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git revert --no-edit -m 1 ${{ github.sha }}
          git push origin ${{ github.event.pull_request.base.ref }}
          echo "Merge reverted. Code and live state are consistent again."

      - name: "[ACCEPT] Rollback freshness gate"
        id: freshness
        if: |
          (github.event_name == 'pull_request' && github.event.pull_request.merged == true) ||
          (github.event_name == 'workflow_dispatch' && github.event.inputs.action_type == 'Accept (Align State)')
        working-directory: ${{ needs.resolve-scope.outputs.tf_working_dir }}
        run: |
          echo "🔍 Running rollback freshness check …"
          python ${{ github.workspace }}/drift_reconciler/rollback_check.py \
            ${{ github.event.pull_request.number }} \
            tfplan.json \
            --pagerduty-scope ${{ needs.resolve-scope.outputs.scope }}

      - name: "[ACCEPT] Rollback recovery — revert merge"
        if: |
          steps.freshness.outcome == 'failure' &&
          github.event_name == 'pull_request' &&
          github.event.pull_request.merged == true
        run: |
          echo "❌ Rollback freshness check failed — reverting merge to restore consistency."
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git revert --no-edit -m 1 ${{ github.sha }}
          git push origin ${{ github.event.pull_request.base.ref }}
          echo "Merge reverted. Code and live state are consistent again."

      - name: "[ACCEPT] Apply"
        if: |
          (github.event_name == 'pull_request' && github.event.pull_request.merged == true) ||
          (github.event_name == 'workflow_dispatch' && github.event.inputs.action_type == 'Accept (Align State)')
        working-directory: ${{ needs.resolve-scope.outputs.tf_working_dir }}
        run: terraform apply -auto-approve tfplan

      - name: "[ACCEPT] Mark drift history resolved"
        if: |
          (github.event_name == 'pull_request' && github.event.pull_request.merged == true) ||
          (github.event_name == 'workflow_dispatch' && github.event.inputs.action_type == 'Accept (Align State)')
        run: |
          RESOLUTION="PR merged — code updated to match live AWS state"
          case "${{ github.event.pull_request.title }}" in
            *"[ROLLBACK]"*) RESOLUTION="Rollback merged — code reverted to pre-fix state" ;;
          esac
          python ${{ github.workspace }}/drift_reconciler/drift_history.py resolve \
            ${{ github.event.pull_request.number }} \
            ${{ needs.resolve-scope.outputs.scope }} \
            "$RESOLUTION"

      # =================================================================
      # SCENARIO B: REJECTED (Closed) → Revert AWS to match original code
      # =================================================================
      - name: "[REJECT] Pre-apply drift gate"
        id: reject_drift_gate
        if: |
          (github.event_name == 'pull_request' && github.event.pull_request.merged == false) ||
          (github.event_name == 'workflow_dispatch' && github.event.inputs.action_type == 'Reject (Revert Code)')
        run: |
          MODE="${{ vars.DRIFT_GATE_MODE }}"
          ARGS="${{ needs.resolve-scope.outputs.scope }}"
          if [ "$MODE" = "block" ]; then
            ARGS="$ARGS --block"
          fi
          python ${{ github.workspace }}/drift_reconciler/pre_apply_check.py $ARGS

      - name: "[REJECT] Revert Drift to Match Code"
        if: |
          (github.event_name == 'pull_request' && github.event.pull_request.merged == false) ||
          (github.event_name == 'workflow_dispatch' && github.event.inputs.action_type == 'Reject (Revert Code)')
        working-directory: ${{ needs.resolve-scope.outputs.tf_working_dir }}
        run: |
          echo "❌ REJECTED: Planning revert to original code for ${{ needs.resolve-scope.outputs.scope }}..."
          terraform plan -out=tfplan -input=false
          echo "Applying revert..."
          terraform apply -auto-approve tfplan

      - name: "[REJECT] Mark drift history resolved"
        if: |
          (github.event_name == 'pull_request' && github.event.pull_request.merged == false) ||
          (github.event_name == 'workflow_dispatch' && github.event.inputs.action_type == 'Reject (Revert Code)')
        run: |
          RESOLUTION="PR closed — AWS reverted to match original code"
          case "${{ github.event.pull_request.title }}" in
            *"[ROLLBACK]"*) RESOLUTION="Rollback closed — original fix restored" ;;
          esac
          python ${{ github.workspace }}/drift_reconciler/drift_history.py resolve \
            ${{ github.event.pull_request.number }} \
            ${{ needs.resolve-scope.outputs.scope }} \
            "$RESOLUTION"

      - name: Comment Result
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const merged = '${{ github.event.pull_request.merged }}' === 'true';
            const scope  = '${{ needs.resolve-scope.outputs.scope }}';
            const outcome = merged
              ? `✅ **ACCEPTED** (${scope}): Drift fix applied.`
              : `❌ **REJECTED** (${scope}): Drift reverted. AWS restored to original code.`;
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: outcome
            });

      # ------------------------------------------------------------------
      # Slack notification on every outcome (success, failure, or abort).
      # ------------------------------------------------------------------
      - name: "[NOTIFY] Slack"
        if: always()
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          SCOPE="${{ needs.resolve-scope.outputs.scope }}"
          PR="${{ github.event.pull_request.number }}"

          # Determine outcome from job state and step results.
          if [ "${{ steps.freshness.outcome }}" = "failure" ]; then
            OUTCOME="rollback_blocked"
            DETAILS="Rollback freshness check failed — merge was reverted."
          elif [ "${{ job.status }}" = "failure" ]; then
            OUTCOME="failed"
            DETAILS="One or more steps failed. Check the run logs."
          elif [ "${{ github.event.pull_request.merged }}" = "true" ] || \
               [ "${{ github.event.inputs.action_type }}" = "Accept (Align State)" ]; then
            OUTCOME="accepted"
            DETAILS=""
          else
            OUTCOME="rejected"
            DETAILS=""
          fi

          python ${{ github.workspace }}/drift_reconciler/workflow_notify.py "$OUTCOME" "$SCOPE" "$PR" "$DETAILS"

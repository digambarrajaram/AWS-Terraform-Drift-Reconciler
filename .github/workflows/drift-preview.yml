name: "Preview Drift Plan"

on:
  pull_request:
    types: [opened, synchronize]
    branches:
      - main

permissions:
  id-token: write
  contents: read
  pull-requests: write

env:
  TF_VERSION: "1.9.8"
  SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
  SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
  SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}

jobs:
  # ------------------------------------------------------------------
  # Same scope resolution as drift-reconciler.yml, but this job only
  # needs the SCAN role — `terraform plan` is read-only, so it runs
  # unattended (no gh_environment / approval gate needed here).
  # ------------------------------------------------------------------
  resolve-scope:
    if: contains(github.event.pull_request.title, 'Drift fix')
    runs-on: ubuntu-latest
    outputs:
      scope:           ${{ steps.scope.outputs.scope }}
      aws_region_var:  ${{ steps.scope.outputs.aws_region_var }}
      role_arn:        ${{ steps.scope.outputs.role_arn }}
      tf_working_dir:  ${{ steps.scope.outputs.tf_working_dir }}
    steps:
      - name: Resolve scope from PR branch/title
        id: scope
        run: |
          BRANCH="${{ github.event.pull_request.head.ref }}"
          SCOPE=$(echo "$BRANCH" | sed -n 's|.*drift-fix/\([^/]*\)/.*|\1|p')

          if [ -z "$SCOPE" ]; then
            TITLE="${{ github.event.pull_request.title }}"
            # NOTE: assumes slugs are prefixed "scope-" — update if/when the
            # scope→environment terminology migration changes naming convention.
            SCOPE=$(echo "$TITLE" | sed -n 's/.*\[\(scope-[a-z0-9][a-z0-9-]*\)\].*/\1/p')
          fi

          if [ -z "$SCOPE" ]; then
            echo "::error::Could not resolve scope from branch or PR title"
            exit 1
          fi

          ENV_RESP=$(curl -sS -w "\n%{http_code}" \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
            "${SUPABASE_URL}/rest/v1/environments?select=region,tf_directory_path,aws_role_arn,scan_role_arn&slug=eq.${SCOPE}&is_active=eq.true")

          HTTP_CODE=$(echo "$ENV_RESP" | tail -1)
          ENV_JSON=$(echo "$ENV_RESP" | sed '$d')

          if [ "$HTTP_CODE" != "200" ]; then
            echo "::error::Supabase API returned HTTP $HTTP_CODE for scope=${SCOPE}"
            exit 1
          fi
          if [ -z "$ENV_JSON" ] || [ "$ENV_JSON" = "[]" ]; then
            echo "::error::No active environment found for scope=${SCOPE} in Supabase environments table"
            exit 1
          fi

          REGION=$(echo "$ENV_JSON" | jq -r '.[0].region')
          ROLE_ARN=$(echo "$ENV_JSON" | jq -r '.[0].scan_role_arn // .[0].aws_role_arn')
          TF_DIR=$(echo "$ENV_JSON" | jq -r '.[0].tf_directory_path')

          for pair in "region:$REGION" "aws_role_arn:$ROLE_ARN" "tf_directory_path:$TF_DIR"; do
            key="${pair%%:*}"; val="${pair#*:}"
            if [ -z "$val" ] || [ "$val" = "null" ]; then
              echo "::error::$key is empty for scope=${SCOPE} in Supabase"
              exit 1
            fi
          done

          echo "scope=$SCOPE"                 >> "$GITHUB_OUTPUT"
          echo "aws_region_var=$REGION"       >> "$GITHUB_OUTPUT"
          echo "role_arn=$ROLE_ARN"           >> "$GITHUB_OUTPUT"
          echo "tf_working_dir=$TF_DIR"       >> "$GITHUB_OUTPUT"
          echo "🔍 Resolved scope=$SCOPE  region=$REGION  role_arn=$ROLE_ARN  dir=$TF_DIR"

  preview:
    needs: [resolve-scope]
    if: contains(github.event.pull_request.title, 'Drift fix')
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          # Preview always evaluates the PR's proposed change against the
          # merge-preview ref — unlike the apply workflow, this one only
          # ever runs while the PR is open, so the default merge ref is
          # fine here (no stale-ref risk like the post-close apply job had).
          ref: ${{ github.event.pull_request.head.ref }}

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ needs.resolve-scope.outputs.role_arn }}
          aws-region: ${{ needs.resolve-scope.outputs.aws_region_var }}
          audience: sts.amazonaws.com

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform Init
        working-directory: ${{ needs.resolve-scope.outputs.tf_working_dir }}
        run: terraform init

      - name: Terraform Plan
        id: plan
        working-directory: ${{ needs.resolve-scope.outputs.tf_working_dir }}
        run: terraform plan -no-color -input=false
        continue-on-error: true

      - name: Comment Plan on PR
        uses: actions/github-script@v7
        with:
          script: |
            const scope = '${{ needs.resolve-scope.outputs.scope }}';
            const planOutput = `${{ steps.plan.outputs.stdout }}${{ steps.plan.outputs.stderr }}`;
            const truncated = planOutput.length > 6000 ? planOutput.substring(0, 6000) + '\n\n... (truncated)' : planOutput;

            const body = `## 📋 Drift Plan Preview (${scope})

            **PR:** #${{ github.event.pull_request.number }}

            <details><summary>📝 Click to expand Terraform Plan</summary>

            \`\`\`\n${truncated}\n\`\`\`

            </details>

            ---

            **Next Steps:**
            - ✅ **Merge this PR** → Accept the drift. Apply code to match live AWS state.
            - ❌ **Close this PR** → Reject the drift. Revert AWS to match original code.
            `;

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: body
            });